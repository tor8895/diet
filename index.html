<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#F2F2F7">
    <title>飲食體重紀錄</title>
    
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <style>
        :root {
            --primary-color: #34C759;
            --danger-color: #FF3B30; /* Red for deficit */
            --background-color: #F2F2F7;
            --card-color: #FFFFFF;
            --text-primary: #1C1C1E;
            --text-secondary: #8E8E93;
            --border-radius: 16px;
            --input-bg: #F5F5F5;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: var(--background-color); display: flex; justify-content: center; padding: 20px; min-height: 100vh; color: var(--text-primary); align-items: flex-start; }
        .container { background-color: var(--card-color); width: 100%; max-width: 460px; padding: 25px; border-radius: var(--border-radius); box-shadow: 0 10px 30px rgba(0,0,0,0.06); margin-bottom: 30px; }
        h1 { font-size: 22px; font-weight: 800; margin-bottom: 20px; text-align: center; }
        .section-title { font-size: 13px; font-weight: 700; color: var(--text-secondary); text-transform: uppercase; margin: 25px 0 10px 0; padding-bottom: 5px; border-bottom: 1px solid #E5E5EA; }
        .meal-title { font-size: 15px; font-weight: 600; margin: 15px 0 8px 0; color: var(--text-primary); display: flex; justify-content: space-between; }
        .input-row { display: flex; gap: 10px; }
        .input-col { flex: 1; }
        label { display: block; font-size: 12px; font-weight: 600; margin-bottom: 6px; color: var(--text-secondary); }
        
        input[type="number"] {
            width: 100%; padding: 12px; border: 1px solid transparent; background-color: var(--input-bg);
            border-radius: 10px; font-size: 16px; outline: none; transition: all 0.2s; inputmode: decimal;
        }
        input[type="number"]:focus { background-color: #fff; border-color: var(--primary-color); box-shadow: 0 0 0 3px rgba(52, 199, 89, 0.1); }

        /* 赤字輸入框特別樣式 */
        .deficit-input:focus { border-color: var(--danger-color) !important; box-shadow: 0 0 0 3px rgba(255, 59, 48, 0.1) !important; }

        .result-container { margin-top: 25px; display: flex; flex-direction: column; gap: 15px; }
        .result-card { background-color: #F9F9F9; border-radius: 12px; padding: 16px; }
        .result-card.highlight { background: linear-gradient(135deg, #34C759 0%, #28a745 100%); color: white; }
        .card-header { display: flex; justify-content: space-between; margin-bottom: 5px; }
        .card-title { font-size: 14px; font-weight: 700; opacity: 0.9; }
        .big-value { font-size: 28px; font-weight: 800; text-align: right; }
        .unit { font-size: 14px; font-weight: 600; margin-left: 4px; }

        .summary-row { display: flex; justify-content: space-between; margin-top: 10px; padding-top: 10px; border-top: 1px solid #eee; }
        .summary-item { text-align: center; flex: 1; }
        .summary-label { font-size: 12px; color: var(--text-secondary); margin-bottom: 4px; }
        .summary-value { font-size: 18px; font-weight: 700; }
        
        .status-badge {
            font-size: 12px; padding: 4px 8px; border-radius: 12px; background: #eee; color: #888; margin-bottom: 15px; text-align: center; display: none;
        }
        .status-badge.saved { display: block; background: #e8f5e9; color: #2e7d32; }

        .btn-group { margin-top: 25px; display: flex; gap: 10px; }
        .btn { flex: 1; padding: 14px; border-radius: 12px; font-size: 16px; font-weight: 600; cursor: pointer; border: none; transition: all 0.2s; }
        
        /* 上傳按鈕 */
        .save-btn { background-color: var(--primary-color); color: white; box-shadow: 0 4px 12px rgba(52, 199, 89, 0.3); }
        .save-btn:disabled { background-color: #ccc; box-shadow: none; cursor: not-allowed; }
        
        /* 清空按鈕 */
        .reset-btn { background-color: transparent; color: var(--text-secondary); border: 1px solid #e1e1e1; }

        #loadingOverlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255,255,255,0.8);
            z-index: 100; display: none; justify-content: center; align-items: center; font-weight: 600; color: var(--primary-color);
        }
    </style>
</head>
<body>

<div id="loadingOverlay">資料上傳中...</div>

<div class="container">
    <h1>飲食與體重紀錄</h1>
    
    <div id="localStatus" class="status-badge">已暫存：下次打開還在，尚未上傳</div>

    <div class="section-title">今日數據</div>
    <div class="input-group">
        <label>今日體重 (kg)</label>
        <input type="number" id="weightInput" placeholder="0" min="0" step="0.1">
    </div>

    <div class="section-title">三餐攝取 (自動加總)</div>
    
    <div class="meal-title">早餐</div>
    <div class="input-row">
        <div class="input-col"><label>蛋白質(g)</label><input type="number" class="protein-input" data-key="bp"></div>
        <div class="input-col"><label>熱量(kcal)</label><input type="number" class="cal-input" data-key="bc"></div>
    </div>

    <div class="meal-title">午餐</div>
    <div class="input-row">
        <div class="input-col"><label>蛋白質(g)</label><input type="number" class="protein-input" data-key="lp"></div>
        <div class="input-col"><label>熱量(kcal)</label><input type="number" class="cal-input" data-key="lc"></div>
    </div>

    <div class="meal-title">晚餐</div>
    <div class="input-row">
        <div class="input-col"><label>蛋白質(g)</label><input type="number" class="protein-input" data-key="dp"></div>
        <div class="input-col"><label>熱量(kcal)</label><input type="number" class="cal-input" data-key="dc"></div>
    </div>
    
    <div class="section-title">每日總結</div>
    <div class="input-group">
        <label style="color: var(--danger-color);">今日熱量赤字 (kcal)</label>
        <input type="number" id="deficitInput" class="deficit-input" placeholder="例如: 300" step="1">
    </div>

    <div class="result-container">
        <div class="result-card highlight">
            <div class="card-header"><span class="card-title">今日總攝取</span></div>
            <div class="summary-row">
                <div class="summary-item">
                    <div class="summary-label">總蛋白質</div>
                    <div class="summary-value" id="totalProtein">0 g</div>
                </div>
                <div class="summary-item" style="border-left: 1px solid rgba(255,255,255,0.3);">
                    <div class="summary-label">總熱量</div>
                    <div class="summary-value" id="totalCalories">0 Kcal</div>
                </div>
            </div>
        </div>
    </div>
    
    <div class="btn-group">
        <button class="btn reset-btn" onclick="clearLocalData()">清空重填</button>
        <button class="btn save-btn" id="saveBtn" onclick="uploadData()" disabled>上傳今日總結</button>
    </div>
</div>

<script>
    // *** 請填入您的 Google Script 網址 ***
    const GOOGLE_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzNfXRjBSvqWSP7W-TGtGYj8PEEmO5wzHiGlzr074m0pqTNWRmd6ndwxHRCMH5VI2At-A/exec'; 

    // DOM 元素
    const inputs = document.querySelectorAll('input');
    const weightInput = document.getElementById('weightInput');
    const deficitInput = document.getElementById('deficitInput');
    const totalProteinDisplay = document.getElementById('totalProtein');
    const totalCaloriesDisplay = document.getElementById('totalCalories');
    const saveBtn = document.getElementById('saveBtn');
    const localStatus = document.getElementById('localStatus');
    const loadingOverlay = document.getElementById('loadingOverlay');

    // 1. 初始化：載入 Service Worker 與 本地暫存資料
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js'));
    }
    
    // 一進來就嘗試從手機記憶體撈資料
    loadFromLocal();

    // 2. 計算與儲存邏輯
    function calculateAndSave() {
        let totalP = 0;
        let totalC = 0;
        let hasData = false;

        // 遍歷所有輸入框
        inputs.forEach(input => {
            const val = parseFloat(input.value);
            if (!isNaN(val) && val > 0) {
                hasData = true;
                
                // 根據 class 判斷是蛋白質還是熱量來加總
                if (input.classList.contains('protein-input')) totalP += val;
                if (input.classList.contains('cal-input')) totalC += val;
            }
            
            // **核心功能：邊打字邊存到 localStorage**
            // 使用 input 的 id 或是 data-key 當作儲存的鑰匙
            const key = input.id || input.dataset.key;
            if (key) localStorage.setItem('diet_' + key, input.value);
        });

        // 更新畫面顯示
        totalProteinDisplay.textContent = `${totalP} g`;
        totalCaloriesDisplay.textContent = `${totalC} Kcal`;
        
        // 顯示「已暫存」提示
        if (hasData) {
            localStatus.classList.add('saved');
            saveBtn.disabled = false;
        } else {
            localStatus.classList.remove('saved');
            saveBtn.disabled = true;
        }
    }

    // 3. 從 LocalStorage 讀取資料
    function loadFromLocal() {
        inputs.forEach(input => {
            const key = input.id || input.dataset.key;
            const savedVal = localStorage.getItem('diet_' + key);
            if (savedVal) input.value = savedVal;
        });
        calculateAndSave(); // 讀取完後重新計算一次總和
    }

    // 4. 清空功能 (包含清除記憶體)
    function clearLocalData() {
        if(!confirm('確定要清空所有欄位嗎？(這會清除暫存)')) return;
        
        inputs.forEach(input => {
            input.value = '';
            const key = input.id || input.dataset.key;
            localStorage.removeItem('diet_' + key);
        });
        calculateAndSave();
    }

    // 5. 上傳到 Google Sheet
    function uploadData() {
        if (!confirm('確定這是一整天的最終數據嗎？上傳後將會清空目前欄位。')) return;

        loadingOverlay.style.display = 'flex';
        saveBtn.disabled = true;

        // 準備總結數據
        const data = {
            weight: weightInput.value || 0,
            protein: totalProteinDisplay.textContent.replace(' g', ''),
            calories: totalCaloriesDisplay.textContent.replace(' Kcal', ''),
            deficit: deficitInput.value || 0
        };

        fetch(GOOGLE_SCRIPT_URL, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(data)
        }).then(() => {
            alert('今日紀錄已成功上傳！');
            // 上傳成功後，清空本地資料，準備迎接明天
            inputs.forEach(input => {
                input.value = '';
                const key = input.id || input.dataset.key;
                localStorage.removeItem('diet_' + key);
            });
            calculateAndSave();
        }).catch(err => {
            alert('上傳失敗，請檢查網路。');
            console.error(err);
        }).finally(() => {
            loadingOverlay.style.display = 'none';
        });
    }

    // 綁定所有輸入框的輸入事件
    inputs.forEach(input => {
        input.addEventListener('input', calculateAndSave);
    });
</script>

</body>
</html>
