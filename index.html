<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#F2F2F7">
    <title>飲食體重紀錄</title>
    
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <style>
        :root {
            --primary-color: #34C759; /* iOS Green for health */
            --accent-color: #FF9500;  /* Orange for calories */
            --background-color: #F2F2F7;
            --card-color: #FFFFFF;
            --text-primary: #1C1C1E;
            --text-secondary: #8E8E93;
            --border-radius: 16px;
            --input-bg: #F5F5F5;
            --divider-color: #E5E5EA;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--background-color);
            display: flex;
            justify-content: center;
            padding: 20px;
            min-height: 100vh;
            color: var(--text-primary);
            /* 避免手機鍵盤彈起時頁面被壓縮 */
            align-items: flex-start; 
        }

        .container {
            background-color: var(--card-color);
            width: 100%;
            max-width: 460px;
            padding: 25px;
            border-radius: var(--border-radius);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.06);
            margin-bottom: 30px; /* 預留底部空間 */
        }

        h1 {
            font-size: 22px;
            font-weight: 800;
            margin-bottom: 20px;
            text-align: center;
        }

        .section-title {
            font-size: 13px;
            font-weight: 700;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin: 25px 0 10px 0;
            padding-bottom: 5px;
            border-bottom: 1px solid var(--divider-color);
        }
        
        .meal-title {
             font-size: 15px;
             font-weight: 600;
             margin: 15px 0 8px 0;
             color: var(--text-primary);
        }

        .input-group { margin-bottom: 15px; }
        
        /* 讓兩個輸入框並排 */
        .input-row {
            display: flex;
            gap: 10px;
        }
        .input-col {
            flex: 1;
        }

        label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 6px;
            color: var(--text-secondary);
        }

        input[type="number"] {
            width: 100%;
            padding: 12px;
            border: 1px solid transparent;
            background-color: var(--input-bg);
            border-radius: 10px;
            font-size: 16px;
            outline: none;
            transition: all 0.2s;
            /* 讓手機數字鍵盤更容易出現 */
            inputmode: decimal; 
        }

        input[type="number"]:focus {
            background-color: #fff;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(52, 199, 89, 0.1);
        }

        /* 結果顯示區塊 */
        .result-container {
            margin-top: 25px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .result-card {
            background-color: #F9F9F9;
            border-radius: 12px;
            padding: 16px;
        }

        .result-card.highlight {
            background: linear-gradient(135deg, var(--primary-color) 0%, #28a745 100%);
            color: white;
            box-shadow: 0 4px 12px rgba(52, 199, 89, 0.3);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 5px;
        }
        
        .card-title { font-size: 14px; font-weight: 700; opacity: 0.9; }
        .big-value { font-size: 28px; font-weight: 800; text-align: right; }
        .unit { font-size: 14px; font-weight: 600; margin-left: 4px; }

        .summary-row {
            display: flex;
            justify-content: space-between;
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid #eee;
        }
        .summary-item { text-align: center; flex: 1; }
        .summary-label { font-size: 12px; color: var(--text-secondary); margin-bottom: 4px; }
        .summary-value { font-size: 18px; font-weight: 700; color: var(--text-primary); }
        .accent-text { color: var(--accent-color); }

        /* 按鈕群組 */
        .btn-group {
            margin-top: 25px;
            display: flex;
            gap: 10px;
        }

        .btn {
            flex: 1;
            padding: 14px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            border: none;
            transition: all 0.2s;
        }

        .save-btn {
            background-color: var(--primary-color);
            color: white;
            box-shadow: 0 4px 12px rgba(52, 199, 89, 0.3);
        }
        .save-btn:hover { background-color: #2dad4b; }
        .save-btn:active { transform: scale(0.98); }
        .save-btn:disabled { background-color: #ccc; box-shadow: none; cursor: not-allowed; }

        .reset-btn {
            background-color: transparent;
            color: var(--text-secondary);
            border: 1px solid #e1e1e1;
        }
        .reset-btn:hover { background-color: #f0f0f0; }
        
        /* 讀取中遮罩 */
        #loadingOverlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255,255,255,0.8); z-index: 100;
            display: none; justify-content: center; align-items: center;
            font-weight: 600; color: var(--primary-color);
        }

    </style>
</head>
<body>

<div id="loadingOverlay">資料儲存中...</div>

<div class="container">
    <h1>今日飲食紀錄</h1>

    <div class="section-title">基本資料</div>
    <div class="input-group">
        <label>今日體重 (公斤)</label>
        <input type="number" id="weightInput" placeholder="例如: 65.5" min="0" step="0.1">
    </div>

    <div class="section-title">三餐攝取</div>
    
    <div class="meal-title">早餐 Breakfast</div>
    <div class="input-row">
        <div class="input-col">
            <label>蛋白質 (g)</label>
            <input type="number" class="protein-input" placeholder="0" min="0">
        </div>
        <div class="input-col">
            <label>熱量 (Kcal)</label>
            <input type="number" class="cal-input" placeholder="0" min="0">
        </div>
    </div>

    <div class="meal-title">午餐 Lunch</div>
    <div class="input-row">
        <div class="input-col">
            <label>蛋白質 (g)</label>
            <input type="number" class="protein-input" placeholder="0" min="0">
        </div>
        <div class="input-col">
            <label>熱量 (Kcal)</label>
            <input type="number" class="cal-input" placeholder="0" min="0">
        </div>
    </div>

    <div class="meal-title">晚餐 Dinner</div>
    <div class="input-row">
        <div class="input-col">
            <label>蛋白質 (g)</label>
            <input type="number" class="protein-input" placeholder="0" min="0">
        </div>
        <div class="input-col">
            <label>熱量 (Kcal)</label>
            <input type="number" class="cal-input" placeholder="0" min="0">
        </div>
    </div>


    <div class="result-container">
        <div class="result-card highlight">
            <div class="card-header"><span class="card-title">當前體重</span></div>
            <div class="big-value" id="currentWeight">0<span class="unit">kg</span></div>
        </div>

        <div class="result-card">
            <div class="card-header"><span class="card-title">今日總攝取</span></div>
            <div class="summary-row">
                <div class="summary-item">
                    <div class="summary-label">總蛋白質</div>
                    <div class="summary-value" id="totalProtein">0 g</div>
                </div>
                <div class="summary-item" style="border-left: 1px solid #eee;">
                    <div class="summary-label">總熱量</div>
                    <div class="summary-value accent-text" id="totalCalories">0 Kcal</div>
                </div>
            </div>
        </div>
    </div>
    
    <div class="btn-group">
        <button class="btn reset-btn" onclick="resetForm()">清空</button>
        <button class="btn save-btn" id="saveBtn" onclick="saveDataToGoogleSheet()" disabled>儲存紀錄</button>
    </div>
</div>

<script>
    // --- PWA Service Worker ---
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('./sw.js').catch(err => console.log('SW fail', err));
        });
    }

    // --- 計算邏輯 ---
    const weightInput = document.getElementById('weightInput');
    const proteinInputs = document.querySelectorAll('.protein-input');
    const calInputs = document.querySelectorAll('.cal-input');
    
    const currentWeightDisplay = document.getElementById('currentWeight');
    const totalProteinDisplay = document.getElementById('totalProtein');
    const totalCaloriesDisplay = document.getElementById('totalCalories');
    const saveBtn = document.getElementById('saveBtn');
    const loadingOverlay = document.getElementById('loadingOverlay');

    // *** 重要：請在階段二完成後，將您的 Google Apps Script 網址貼在這裡 ***
    const GOOGLE_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzNfXRjBSvqWSP7W-TGtGYj8PEEmO5wzHiGlzr074m0pqTNWRmd6ndwxHRCMH5VI2At-A/exec'; 

    function calculateTotals() {
        // 1. 體重顯示
        let weight = parseFloat(weightInput.value) || 0;
        currentWeightDisplay.innerHTML = `${weight}<span class="unit">kg</span>`;

        // 2. 計算總蛋白質
        let totalP = 0;
        proteinInputs.forEach(input => {
            totalP += parseFloat(input.value) || 0;
        });
        totalProteinDisplay.textContent = `${totalP} g`;

        // 3. 計算總熱量
        let totalC = 0;
        calInputs.forEach(input => {
            totalC += parseFloat(input.value) || 0;
        });
        totalCaloriesDisplay.textContent = `${totalC} Kcal`;

        // 4. 檢查是否可以儲存 (至少要有體重或任何一項飲食輸入)
        let hasData = weight > 0 || totalP > 0 || totalC > 0;
        // 如果沒有設定 URL 也不能按
        saveBtn.disabled = !hasData || GOOGLE_SCRIPT_URL === '';
    }

    function resetForm() {
        weightInput.value = '';
        proteinInputs.forEach(i => i.value = '');
        calInputs.forEach(i => i.value = '');
        calculateTotals();
    }

    // 綁定監聽
    [weightInput, ...proteinInputs, ...calInputs].forEach(input => {
        input.addEventListener('input', calculateTotals);
    });

    // --- Google Sheet 儲存功能 (階段二重點) ---
    function saveDataToGoogleSheet() {
        if (!confirm('確定要儲存今天的紀錄到 Google 試算表嗎？')) return;

        loadingOverlay.style.display = 'flex';
        saveBtn.disabled = true;

        // 準備要傳送的資料
        const data = {
            weight: weightInput.value || 0,
            protein: totalProteinDisplay.textContent.replace(' g', ''),
            calories: totalCaloriesDisplay.textContent.replace(' Kcal', ''),
            // 也可以把細項傳過去，這裡示範傳總和
            details: {
               b_p: proteinInputs[0].value, b_c: calInputs[0].value,
               l_p: proteinInputs[1].value, l_c: calInputs[1].value,
               d_p: proteinInputs[2].value, d_c: calInputs[2].value,
            }
        };

        // 使用 fetch 傳送 (no-cors 模式是關鍵)
        fetch(GOOGLE_SCRIPT_URL, {
            method: 'POST',
            mode: 'no-cors', // 重要：避開跨域問題，但無法讀取回傳結果
            cache: 'no-cache',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify(data)
        }).then(() => {
            // 因為 no-cors 我們不知道是否真的成功，但通常沒報錯就是成功發出了
            alert('紀錄已送出！');
            resetForm();
        }).catch(err => {
            alert('發送失敗，請檢查網路或 URL 設定。');
            console.error(err);
        }).finally(() => {
            loadingOverlay.style.display = 'none';
            calculateTotals(); // 重新檢查按鈕狀態
        });
    }

    calculateTotals();
</script>

</body>
</html>
